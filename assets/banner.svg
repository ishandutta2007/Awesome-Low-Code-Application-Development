<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 22px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #e2e8f0;
    }
    
    /* Dynamic floating animations */
    @keyframes float1 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(14px) rotate(-1.5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes pulse-glow {
      0% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0.3; }
    }
    
    .animated-bg-1 { animation: float1 8s ease-in-out infinite; }
    .animated-bg-2 { animation: float2 10s ease-in-out infinite; }
    .pulse-elem { animation: pulse-glow 4s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-gradient)" />

  <!-- Decorative Grid Pattern in Background -->
  <g opacity="0.08">
    <path d="M0 50H1200 M0 100H1200 M0 150H1200 M0 200H1200 M0 250H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M100 0V300 M200 0V300 M300 0V300 M400 0V300 M500 0V300 M600 0V300 M700 0V300 M800 0V300 M900 0V300 M1000 0V300 M1100 0V300" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Glowing Orbs (Dynamic background aspects behind components) -->
  <circle cx="150" cy="80" r="120" fill="#6366f1" opacity="0.25" filter="url(#glow)" class="pulse-elem" />
  <circle cx="1050" cy="220" r="140" fill="#ec4899" opacity="0.2" filter="url(#glow)" class="pulse-elem" />
  <circle cx="850" cy="60" r="90" fill="#a855f7" opacity="0.25" filter="url(#glow)" />

  <!-- Background Animated Visual Elements (Pills & Wireframe Cards positioned away from central text foreground) -->
  <g class="animated-bg-1" opacity="0.4">
    <!-- Component Node Mockup Left -->
    <rect x="50" y="160" width="160" height="90" rx="10" fill="url(#card-grad)" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="70" y="180" width="80" height="10" rx="4" fill="#818cf8"/>
    <rect x="70" y="200" width="120" height="8" rx="4" fill="#475569"/>
    <rect x="70" y="215" width="100" height="8" rx="4" fill="#475569"/>
    <circle cx="180" cy="185" r="6" fill="#22c55e"/>
  </g>

  <g class="animated-bg-2" opacity="0.35">
    <!-- Workflow Nodes & Connecting Lines Right -->
    <rect x="960" y="50" width="180" height="80" rx="10" fill="url(#card-grad)" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="980" y="70" width="90" height="10" rx="4" fill="#c084fc"/>
    <rect x="980" y="90" width="130" height="8" rx="4" fill="#475569"/>
    
    <path d="M 960 90 L 910 130" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4"/>
    
    <rect x="830" y="140" width="140" height="70" rx="10" fill="url(#card-grad)" stroke="#ec4899" stroke-width="1.5"/>
    <rect x="850" y="160" width="70" height="8" rx="4" fill="#f472b6"/>
    <rect x="850" y="175" width="100" height="8" rx="4" fill="#475569"/>
  </g>

  <!-- Foreground Content: Accent Line, Title, Subtitle, and Badges -->
  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent-gradient)" />

  <g transform="translate(100, 0)">
    <!-- Category Pill / Badge -->
    <g transform="translate(0, 50)">
      <rect width="260" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <text x="130" y="21" text-anchor="middle" class="badge-text" fill="#a5b4fc">🚀 AWESOME ECOSYSTEM LIST</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="135" class="title" filter="url(#shadow)">
      Awesome Low-Code Development
    </text>

    <!-- Subtitle -->
    <text x="0" y="178" class="subtitle">
      Top Platforms, SaaS Builders, Open-Source Tools &amp; Internal App Frameworks
    </text>

    <!-- Tech Stack Feature Badges -->
    <g transform="translate(0, 215)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="30" rx="6" fill="#334155" opacity="0.9"/>
        <text x="65" y="20" text-anchor="middle" class="badge-text">⚡ Rapid Delivery</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(142, 0)">
        <rect width="140" height="30" rx="6" fill="#334155" opacity="0.9"/>
        <text x="70" y="20" text-anchor="middle" class="badge-text">🛠️ Internal Tools</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(294, 0)">
        <rect width="150" height="30" rx="6" fill="#334155" opacity="0.9"/>
        <text x="75" y="20" text-anchor="middle" class="badge-text">🌐 SaaS &amp; Open Source</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(456, 0)">
        <rect width="140" height="30" rx="6" fill="#334155" opacity="0.9"/>
        <text x="70" y="20" text-anchor="middle" class="badge-text">👥 Citizen Devs</text>
      </g>
    </g>
  </g>
</svg>
